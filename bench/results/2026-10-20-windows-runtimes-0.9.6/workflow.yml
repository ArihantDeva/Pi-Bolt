name: bench-windows-runtimes

# Pi-Bolt 0.9.6 (the release's zip) against Pi 1.3.0 on stock Bun 1.4.2 (scripts\build-pi.ps1 -Stable, this repository's Pi), on
# Node 22 and on Node 24 (as released on npm), on GitHub's windows-2025 runner: the same suites as the Linux run of bench.yml.
on:
  push:
    branches: ["bench/windows-runtimes-*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Bench on Windows x64
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force results, .work | Out-Null
          $env_lines = @()
          gh release download bolt-v0.9.6 --repo $env:GITHUB_REPOSITORY --pattern pi-bolt-win32-x64.zip --pattern SHA256SUMS --dir .work\cand-dl --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $sum = (Get-FileHash .work\cand-dl\pi-bolt-win32-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath .work\cand-dl\SHA256SUMS) -notcontains "$sum  pi-bolt-win32-x64.zip") { throw "pi-bolt-win32-x64.zip is not the one SHA256SUMS lists" }
          Expand-Archive .work\cand-dl\pi-bolt-win32-x64.zip -DestinationPath .work\cand-dl -Force
          Move-Item .work\cand-dl\pi-bolt-win32-x64 .work\cand
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run build:offline
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & scripts\build-pi.ps1 -Stable -Out out\pi-stable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm install --prefix .work\vanilla --ignore-scripts --no-audit --no-fund '@earendil-works/pi-coding-agent@1.3.0' | Out-Null
          foreach ($v in 22, 24) {
            $base = "https://nodejs.org/dist/latest-v$v.x"
            $sums = (Invoke-WebRequest -UseBasicParsing "$base/SHASUMS256.txt").Content -split "`n"
            $line = $sums | Where-Object { $_ -match 'win-x64\.zip$' } | Select-Object -First 1
            $hash, $file = $line -split '\s+'
            Invoke-WebRequest -UseBasicParsing "$base/$file" -OutFile ".work\$file"
            if ((Get-FileHash ".work\$file" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw "$file does not match SHASUMS256" }
            Expand-Archive ".work\$file" -DestinationPath ".work\node-x$v" -Force
            Move-Item (Get-ChildItem ".work\node-x$v" | Select-Object -First 1).FullName ".work\node$v"
            $env_lines += "node${v}: Pi $(& .work\node$v\node.exe .work\vanilla\node_modules\@earendil-works\pi-coding-agent\dist\bundle\cli.js --version | Select-Object -First 1) as released on npm on $file"
          }
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $nt = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $env_lines += "pi-bolt: Pi-Bolt 0.9.6, pi-bolt-win32-x64.zip from the release (checked against its SHA256SUMS): $(& .work\cand\pi-bolt.exe --version | Select-Object -First 1)"
          $env_lines += "bun: Pi 1.3.0 (this repository's Pi) on stock Bun $(bun --version): scripts\build-pi.ps1 -Stable: $(& out\pi-stable\pi.exe --version | Select-Object -First 1)"
          $env_lines += "runner: windows-2025, $($cpu.Name.Trim()), $($cpu.NumberOfCores) cores, $($cpu.NumberOfLogicalProcessors) threads; $((Get-CimInstance Win32_OperatingSystem).Caption) build $($nt.CurrentBuild).$($nt.UBR)"
          $env_lines | Tee-Object -Variable shown
          [IO.File]::WriteAllLines("$PWD\results\environment.txt", [string[]]$env_lines)
      - name: Suites
        run: |
          $env:PYTHONUTF8 = '1'
          $ErrorActionPreference = 'Continue'
          $VAN = "$PWD\.work\vanilla\node_modules\@earendil-works\pi-coding-agent\dist\bundle\cli.js"
          $B = @('--build', "pi-bolt=$PWD\.work\cand\pi-bolt.exe", '--build', "bun=$PWD\out\pi-stable\pi.exe",
                 '--build', "node22=$PWD\.work\node22\node.exe $VAN", '--build', "node24=$PWD\.work\node24\node.exe $VAN")
          function Run($name, $file, [string[]]$cmd) {
            "## $name" | Add-Content -Encoding utf8 results\all.txt
            $out = & python @cmd 2>&1 | ForEach-Object { "$_" } | Where-Object { $_ -notmatch 'round [0-9]+/' }
            if ($LASTEXITCODE -ne 0) { $out += "$name failed (exit $LASTEXITCODE)" }
            $out
            [IO.File]::WriteAllLines("$PWD\results\$file", [string[]]@($out))
            $out | Add-Content -Encoding utf8 results\all.txt
          }
          Run benchmark benchmark.txt (@('bench\benchmark.py', '--runs', '21', '--warmup', '3', '--scenarios', 'startup,headless,interactive', '--baseline', 'bun') + $B)
          Run long_answer long_answer.txt (@('bench\long_answer.py', '--sizes', '60000') + $B)
          Run long_session long_session.txt (@('bench\long_session.py', '--prompts', '40', '--every', '20') + $B)
          $summary = @('```') + (Get-Content results\environment.txt) + (Get-Content results\all.txt | Where-Object { $_ -notmatch '^\{' }) + @('```')
          $summary | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-win32-x64
          path: results
          retention-days: 30
