name: bench-stock-bun

# Pi-Bolt 0.9.7 (the release's archives) against Pi 1.3.0 as released on npm (@earendil-works/pi-coding-agent, dist/bundle/cli.js),
# run by stock Bun 1.4.2, by Node 22 and by Node 24, on GitHub's Linux x86-64 and ARM64 (one CPU each), macOS and Windows runners.
on:
  push:
    branches: ["bench/stock-bun-*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PI_VERSION: "1.3.0"
  BOLT_TAG: bolt-v0.9.7

jobs:
  unix:
    name: Bench on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86-64, runner: ubuntu-24.04, plat: linux-x64, node: linux-x64, cpus: "1" }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, plat: linux-arm64, node: linux-arm64, cpus: "1" }
          - { name: macOS Apple silicon, runner: macos-15, plat: darwin-arm64, node: darwin-arm64, cpus: "" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
          PLAT: ${{ matrix.plat }}
          NODE_PLAT: ${{ matrix.node }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq tmux >/dev/null; sha() { sha256sum "$@"; }
          else brew install bash tmux >/dev/null; echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"; export PATH="$(brew --prefix)/bin:$PATH"; sha() { shasum -a 256 "$@"; }; fi
          mkdir -p results .work/cand
          gh release download "$BOLT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "pi-bolt-$PLAT.tar.xz" --pattern SHA256SUMS --dir .work/cand
          (cd .work/cand && grep " pi-bolt-$PLAT.tar.xz\$" SHA256SUMS | sha -c -)
          mkdir -p out/cand && tar -C out/cand --strip-components=1 -xJf ".work/cand/pi-bolt-$PLAT.tar.xz"
          npm install --prefix .work/vanilla --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION" >/dev/null
          for v in 22 24; do
            base="https://nodejs.org/dist/latest-v$v.x"
            file=$(curl -fsSL "$base/SHASUMS256.txt" | awk -v f="$NODE_PLAT.tar.xz" '$2 ~ f"$" {print $2}')
            curl -fsSL -o ".work/$file" "$base/$file"
            (cd .work && curl -fsSL "$base/SHASUMS256.txt" | grep " $file\$" | sha -c -)
            mkdir -p ".work/node$v" && tar -C ".work/node$v" --strip-components=1 -xJf ".work/$file"
          done
          VAN=.work/vanilla/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
          {
            echo "runner: ${{ matrix.runner }} ($(uname -srm)), $(nproc 2>/dev/null || sysctl -n hw.ncpu) CPUs"
            if [ "$RUNNER_OS" = Linux ]; then grep -m1 'model name' /proc/cpuinfo || lscpu | grep -m1 'Model name'; else sysctl -n machdep.cpu.brand_string; fi
            echo "pi-bolt: $BOLT_TAG, pi-bolt-$PLAT.tar.xz from the release (checked against its SHA256SUMS): $(out/cand/pi --version </dev/null)"
            echo "bun: Pi $(bun $VAN --version </dev/null) as released on npm, run by stock Bun $(bun --version)"
            for v in 22 24; do echo "node$v: Pi $(.work/node$v/bin/node $VAN --version </dev/null) as released on npm, on Node $(.work/node$v/bin/node --version)"; done
          } | tee results/environment.txt
      - name: Suites
        env:
          CPUS: ${{ matrix.cpus }}
        run: |
          VAN=".work/vanilla/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js"
          B=(--build pi-bolt=out/cand/pi --build "bun=$(command -v bun) $VAN" --build "node22=.work/node22/bin/node $VAN" --build "node24=.work/node24/bin/node $VAN")
          C=(); [ -n "$CPUS" ] && C=(--cpus "$CPUS")
          run() { name=$1; shift; echo "## $name" | tee -a results/all.txt; "$@" 2>&1 | grep -vE 'round [0-9]+/' | tee -a results/all.txt || echo "$name failed" | tee -a results/all.txt; }
          run benchmark python3 bench/benchmark.py --runs 21 --warmup 3 --scenarios startup,headless,interactive "${C[@]}" "${B[@]}" --baseline node24
          run long_answer python3 bench/long_answer.py --sizes 60000 "${C[@]}" "${B[@]}"
          run long_session python3 bench/long_session.py --prompts 40 --every 20 "${C[@]}" "${B[@]}"
          run large_write python3 bench/large_write.py --sizes 200,400 "${C[@]}" "${B[@]}"
          run tmux_load python3 bench/tmux_load.py "${C[@]}" "${B[@]}"
          { echo '```'; cat results/environment.txt results/all.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-${{ matrix.plat }}
          path: results/
          retention-days: 30

  windows:
    name: Bench on Windows x64
    runs-on: windows-2025
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force results, .work | Out-Null
          gh release download $env:BOLT_TAG --repo $env:GITHUB_REPOSITORY --pattern pi-bolt-win32-x64.zip --pattern SHA256SUMS --dir .work\cand-dl --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $sum = (Get-FileHash .work\cand-dl\pi-bolt-win32-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath .work\cand-dl\SHA256SUMS) -notcontains "$sum  pi-bolt-win32-x64.zip") { throw "pi-bolt-win32-x64.zip is not the one SHA256SUMS lists" }
          Expand-Archive .work\cand-dl\pi-bolt-win32-x64.zip -DestinationPath .work\cand-dl -Force
          Move-Item .work\cand-dl\pi-bolt-win32-x64 .work\cand
          npm install --prefix .work\vanilla --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$env:PI_VERSION" | Out-Null
          $env_lines = @()
          foreach ($v in 22, 24) {
            $base = "https://nodejs.org/dist/latest-v$v.x"
            $sums = (Invoke-WebRequest -UseBasicParsing "$base/SHASUMS256.txt").Content -split "`n"
            $line = $sums | Where-Object { $_ -match 'win-x64\.zip$' } | Select-Object -First 1
            $hash, $file = $line -split '\s+'
            Invoke-WebRequest -UseBasicParsing "$base/$file" -OutFile ".work\$file"
            if ((Get-FileHash ".work\$file" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw "$file does not match SHASUMS256" }
            Expand-Archive ".work\$file" -DestinationPath ".work\node-x$v" -Force
            Move-Item (Get-ChildItem ".work\node-x$v" | Select-Object -First 1).FullName ".work\node$v"
          }
          $van = ".work\vanilla\node_modules\@earendil-works\pi-coding-agent\dist\bundle\cli.js"
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $env_lines += "runner: windows-2025, $($cpu.Name.Trim()), $($cpu.NumberOfCores) cores, $($cpu.NumberOfLogicalProcessors) threads"
          $env_lines += "pi-bolt: $env:BOLT_TAG, pi-bolt-win32-x64.zip from the release (checked against its SHA256SUMS): $(& .work\cand\pi-bolt.exe --version | Select-Object -First 1)"
          $env_lines += "bun: Pi $(& bun $van --version | Select-Object -First 1) as released on npm, run by stock Bun $(bun --version)"
          foreach ($v in 22, 24) { $env_lines += "node${v}: Pi $(& .work\node$v\node.exe $van --version | Select-Object -First 1) as released on npm, on Node $(& .work\node$v\node.exe --version)" }
          $env_lines | Tee-Object -Variable shown
          [IO.File]::WriteAllLines("$PWD\results\environment.txt", [string[]]$env_lines)
      - name: Suites
        run: |
          $env:PYTHONUTF8 = '1'
          $ErrorActionPreference = 'Continue'
          $VAN = "$PWD\.work\vanilla\node_modules\@earendil-works\pi-coding-agent\dist\bundle\cli.js"
          $BUN = (Get-Command bun).Source
          $B = @('--build', "pi-bolt=$PWD\.work\cand\pi-bolt.exe", '--build', "bun=$BUN $VAN",
                 '--build', "node22=$PWD\.work\node22\node.exe $VAN", '--build', "node24=$PWD\.work\node24\node.exe $VAN")
          function Run($name, $file, [string[]]$cmd) {
            "## $name" | Add-Content -Encoding utf8 results\all.txt
            $out = & python @cmd 2>&1 | ForEach-Object { "$_" } | Where-Object { $_ -notmatch 'round [0-9]+/' }
            if ($LASTEXITCODE -ne 0) { $out += "$name failed (exit $LASTEXITCODE)" }
            $out
            [IO.File]::WriteAllLines("$PWD\results\$file", [string[]]@($out))
            $out | Add-Content -Encoding utf8 results\all.txt
          }
          Run benchmark benchmark.txt (@('bench\benchmark.py', '--runs', '21', '--warmup', '3', '--scenarios', 'startup,headless,interactive', '--baseline', 'node24') + $B)
          Run long_answer long_answer.txt (@('bench\long_answer.py', '--sizes', '60000') + $B)
          Run long_session long_session.txt (@('bench\long_session.py', '--prompts', '40', '--every', '20') + $B)
          Run large_write large_write.txt (@('bench\large_write.py', '--sizes', '200,400') + $B)
          $summary = @('```') + (Get-Content results\environment.txt) + (Get-Content results\all.txt | Where-Object { $_ -notmatch '^\{' }) + @('```')
          $summary | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-win32-x64
          path: results
          retention-days: 30
