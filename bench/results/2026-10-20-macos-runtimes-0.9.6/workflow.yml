name: bench-macos-runtimes

# Pi-Bolt 0.9.6 (the release's archive) against Pi 1.3.0 on stock Bun 1.4.2 (scripts/build-pi.sh --stable, this repository's Pi),
# on Node 22 and on Node 24 (as released on npm), on GitHub's macOS Apple silicon runner: the same suites as the Linux run of bench.yml.
on:
  push:
    branches: ["bench/macos-runtimes-*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  macos:
    name: Bench on macOS Apple silicon
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew install bash tmux >/dev/null; echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"; export PATH="$(brew --prefix)/bin:$PATH"
          mkdir -p results .work
          gh release download bolt-v0.9.6 --repo "$GITHUB_REPOSITORY" --pattern pi-bolt-darwin-arm64.tar.xz --pattern SHA256SUMS --dir .work/cand
          (cd .work/cand && grep " pi-bolt-darwin-arm64.tar.xz\$" SHA256SUMS | shasum -a 256 -c -)
          mkdir -p out/cand && tar -C out/cand --strip-components=1 -xJf .work/cand/pi-bolt-darwin-arm64.tar.xz
          scripts/prepare-pi.sh
          scripts/build-pi.sh --stable --out out/pi-stable
          npm install --prefix .work/vanilla --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.3.0 >/dev/null
          for v in 22 24; do
            base="https://nodejs.org/dist/latest-v$v.x"
            file=$(curl -fsSL "$base/SHASUMS256.txt" | awk '$2 ~ /darwin-arm64.tar.xz$/ {print $2}')
            curl -fsSL -o ".work/$file" "$base/$file"
            (cd .work && curl -fsSL "$base/SHASUMS256.txt" | grep " $file\$" | shasum -a 256 -c -)
            mkdir -p ".work/node$v" && tar -C ".work/node$v" --strip-components=1 -xJf ".work/$file"
          done
          VAN=.work/vanilla/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
          {
            echo "runner: macos-15 ($(uname -srm)), $(sysctl -n hw.ncpu) CPUs; $(sysctl -n machdep.cpu.brand_string); $(sw_vers | tr '\n' ' ')"
            echo "pi-bolt: Pi-Bolt 0.9.6, pi-bolt-darwin-arm64.tar.xz from the release (checked against its SHA256SUMS): $(out/cand/pi --version </dev/null)"
            echo "bun: Pi 1.3.0 (this repository's Pi) on stock Bun $(bun --version): scripts/build-pi.sh --stable: $(out/pi-stable/pi --version </dev/null)"
            for v in 22 24; do echo "node$v: Pi $(.work/node$v/bin/node $VAN --version </dev/null) as released on npm on Node $(.work/node$v/bin/node --version)"; done
          } | tee results/environment.txt
      - name: Suites
        run: |
          VAN=".work/vanilla/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js"
          B=(--build pi-bolt=out/cand/pi --build bun=out/pi-stable/pi --build "node22=.work/node22/bin/node $VAN" --build "node24=.work/node24/bin/node $VAN")
          run() { name=$1; shift; echo "## $name" | tee -a results/all.txt; "$@" 2>&1 | grep -vE 'round [0-9]+/' | tee -a results/all.txt || echo "$name failed" | tee -a results/all.txt; }
          run benchmark python3 bench/benchmark.py --runs 21 --warmup 3 --scenarios startup,headless,interactive "${B[@]}" --baseline bun
          run long_answer python3 bench/long_answer.py --sizes 60000 "${B[@]}"
          run long_session python3 bench/long_session.py --prompts 40 --every 20 "${B[@]}"
          { echo '```'; cat results/environment.txt results/all.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-darwin-arm64
          path: results/
          retention-days: 30
