name: bench-windows

# bench.yml's comparison on GitHub's windows-2025 runner: rel (pi-bolt-win32-x64.zip of bolt-v0.9.9, checked against the
# release's signed SHA256SUMS), cand (perf/v1.0.0 built by scripts\build-pi.ps1 on the runtime of RUNTIME_RUN) and pig (pig-0.5.1-windows-amd64.zip, SHA256SUMS and sigstore bundle). The tools of bench.yml that
# run on Windows (no tmux); the TUI runs in a ConPTY.
on:
  push:
    branches: ["bench/v1.0.0*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RUNTIME_RUN: "39894603087"
  CAND_COMMIT: "d35149cb0"

jobs:
  windows:
    name: Bench on Windows x64
    runs-on: windows-2025
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force results, .work | Out-Null
          $env_lines = @()
          function Check-Sum($dir, $file) {
            $sum = (Get-FileHash "$dir\$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content -LiteralPath "$dir\SHA256SUMS") -notcontains "$sum  $file") { throw "$file is not the one SHA256SUMS lists" }
          }
          # (The scripts run Python 3 as `py -3`.)
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) {
            $shim = Join-Path $env:RUNNER_TEMP 'py-shim'
            New-Item -ItemType Directory -Force $shim | Out-Null
            Set-Content -Encoding ascii (Join-Path $shim 'py.cmd') "@if `"%~1`"==`"-3`" (python %2 %3 %4 %5 %6 %7 %8 %9) else (python %*)"
            $env:PATH = "$shim;$env:PATH"
            Add-Content -Encoding utf8 $env:GITHUB_PATH $shim
          }
          # rel: 0.9.9 as released; its checksums are signed by the release key.
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          gh release download bolt-v0.9.9 --repo $env:GITHUB_REPOSITORY --pattern pi-bolt-win32-x64.zip --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir .work\rel-dl --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $openssl pkeyutl -verify -pubin -inkey keys\release.pub -rawin -in .work\rel-dl\SHA256SUMS -sigfile .work\rel-dl\SHA256SUMS.sig
          if ($LASTEXITCODE -ne 0) { throw "bolt-v0.9.9's signature does not verify" }
          if ((Get-Content .work\rel-dl\SHA256SUMS)[0] -ne '# pi-bolt 0.9.9') { throw "the checksums are not 0.9.9's" }
          Check-Sum .work\rel-dl pi-bolt-win32-x64.zip
          Expand-Archive .work\rel-dl\pi-bolt-win32-x64.zip -DestinationPath .work\rel-dl -Force
          Move-Item .work\rel-dl\pi-bolt-win32-x64 .work\rel
          $env_lines += "rel: pi-bolt-win32-x64.zip of bolt-v0.9.9 (SHA256SUMS signature and sum verified)"
          # The candidate's runtime.
          New-Item -ItemType Directory -Force .work\rt, .work\runtime | Out-Null
          gh run download $env:RUNTIME_RUN --repo $env:GITHUB_REPOSITORY --name runtime-win32-x64 --dir .work\rt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive .work\rt\pi-bolt-runtime-win32-x64.zip -DestinationPath .work\rt -Force
          Copy-Item .work\rt\pi-bolt-runtime-win32-x64\bun.exe .work\runtime\bun.exe
          $env_lines += "runtime: run $($env:RUNTIME_RUN), $(& .work\runtime\bun.exe --version), sha256 $((Get-FileHash .work\runtime\bun.exe -Algorithm SHA256).Hash.ToLowerInvariant())"
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          function Build-Variant($name) {
            npm run build:offline
            if ($LASTEXITCODE -ne 0) { throw "build:offline failed for $name" }
            & scripts\build-pi.ps1 -Out "out\$name"
            if ($LASTEXITCODE -ne 0) { throw "build-pi.ps1 failed for $name" }
            # As package-release.ps1 lays it out: pi-bolt.exe beside its assets; zipped for the archive's size.
            Copy-Item -Recurse "out\$name" ".work\$name"
            Move-Item ".work\$name\pi.exe" ".work\$name\pi-bolt.exe"
            Copy-Item LICENSE, THIRD_PARTY_NOTICES.md ".work\$name"
            New-Item -ItemType Directory -Force ".work\$name-dl" | Out-Null
            Compress-Archive -Path ".work\$name" -DestinationPath ".work\$name-dl\pi-bolt-win32-x64.zip" -CompressionLevel Optimal
          }
          Build-Variant cand
          $env_lines += "cand: perf/v1.0.0 ($env:CAND_COMMIT) by scripts\build-pi.ps1 on that runtime; zip by Compress-Archive, for its size"
          $pig = 'pig-0.5.1-windows-amd64.zip'
          gh release download v0.5.1 --repo MichaelKinsy/PiG --pattern $pig --pattern "$pig.sigstore.json" --pattern SHA256SUMS --dir .work\pig-dl --clobber
          Check-Sum .work\pig-dl $pig
          gh attestation verify ".work\pig-dl\$pig" --bundle ".work\pig-dl\$pig.sigstore.json" --repo MichaelKinsy/PiG | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "PiG's attestation does not verify" }
          Expand-Archive ".work\pig-dl\$pig" -DestinationPath .work\pig-x -Force
          $pigexe = Get-ChildItem -Recurse .work\pig-x -Filter pig.exe | Select-Object -First 1
          Move-Item $pigexe.Directory.FullName .work\pig
          $env_lines += "pig: $pig, SHA256SUMS and sigstore bundle verified (gh attestation verify)"
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $nt = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $defender = try { $mp = Get-MpComputerStatus; "real-time protection $($mp.RealTimeProtectionEnabled), mode $($mp.AMRunningMode)" } catch { "unknown" }
          foreach ($b in 'rel', 'cand') { $env_lines += "${b}: $(& .work\$b\pi-bolt.exe --version | Select-Object -First 1)" }
          $env_lines += "pig: $(& .work\pig\pig.exe --version | Select-Object -First 1)"
          $env_lines += "runner: windows-2025, $($cpu.Name.Trim()), $($cpu.NumberOfCores) cores, $($cpu.NumberOfLogicalProcessors) threads; $((Get-CimInstance Win32_OperatingSystem).Caption) build $($nt.CurrentBuild).$($nt.UBR); defender: $defender"
          $env_lines += "python: $(python --version)"
          $env_lines
          [IO.File]::WriteAllLines("$PWD\results\environment.txt", [string[]]$env_lines)
      - name: Sizes
        run: |
          function Bytes($p) { if (Test-Path -PathType Leaf $p) { (Get-Item $p).Length } else { (Get-ChildItem -Recurse -File $p | Measure-Object -Sum Length).Sum } }
          $rows = @("build    what         bytes  path")
          foreach ($r in @(
              @('rel', 'archive.zip', '.work\rel-dl\pi-bolt-win32-x64.zip'), @('rel', 'binary', '.work\rel\pi-bolt.exe'), @('rel', 'installed', '.work\rel'),
              @('cand', 'archive.zip', '.work\cand-dl\pi-bolt-win32-x64.zip'), @('cand', 'binary', '.work\cand\pi-bolt.exe'), @('cand', 'installed', '.work\cand'),
              @('pig', 'archive.zip', '.work\pig-dl\pig-0.5.1-windows-amd64.zip'), @('pig', 'binary', '.work\pig\pig.exe'), @('pig', 'installed', '.work\pig'))) {
            $rows += "{0,-8} {1,-12} {2,14}  {3}" -f $r[0], $r[1], (Bytes $r[2]), $r[2]
          }
          $rows
          [IO.File]::WriteAllLines("$PWD\results\sizes.txt", [string[]]$rows)
      - name: Suites
        run: |
          $env:PYTHONUTF8 = '1'
          $ErrorActionPreference = 'Continue'
          $B = @('--build', "rel=$PWD\.work\rel\pi-bolt.exe", '--build', "cand=$PWD\.work\cand\pi-bolt.exe", '--build', "pig=$PWD\.work\pig\pig.exe")
          function Run($name, $file, [string[]]$cmd) {
            "## $name" | Add-Content -Encoding utf8 results\all.txt
            $out = & python @cmd 2>&1 | ForEach-Object { "$_" } | Where-Object { $_ -notmatch 'round [0-9]+/' }
            if ($LASTEXITCODE -ne 0) { $out += "$name failed (exit $LASTEXITCODE)" }
            $out
            [IO.File]::WriteAllLines("$PWD\results\$file", [string[]]@($out))
            $out | Add-Content -Encoding utf8 results\all.txt
          }
          Run verify verify.txt (@('bench\pig_verify.py') + $B)
          Run benchmark benchmark.txt (@('bench\benchmark.py', '--runs', '21', '--warmup', '3', '--baseline', 'rel', '--out', 'results\benchmark.jsonl') + $B)
          foreach ($i in 1, 2, 3) { Run "long_answer $i" "long_answer-$i.txt" (@('bench\long_answer.py', '--sizes', '20000,60000') + $B) }
          Run pauses pauses.txt (@('bench\pauses.py', '--out', 'results\pauses.jsonl') + $B)
          Run idle idle.txt (@('bench\idle.py', '--seconds', '20', '--rounds', '2') + $B)
          Run 'idle 120 s' idle-120.txt (@('bench\idle.py', '--seconds', '120', '--rounds', '1') + $B)
          Run long_transcript long_transcript.txt (@('bench\long_transcript.py', '--entries', '0,2292,4000', '--mode', 'fullscreen,regular', '--rounds', '2', '--json', 'results\long_transcript.jsonl') + $B)
          Run 'long_transcript keys' long_transcript-keys.txt (@('bench\long_transcript.py', '--entries', '2292', '--mode', 'fullscreen,regular', '--keys', '--json', 'results\long_transcript.jsonl') + $B)
          foreach ($i in 1, 2) { Run "long_session $i" "long_session-$i.txt" (@('bench\long_session.py', '--prompts', '40', '--every', '20', '--out', 'results\long.jsonl') + $B) }
          $summary = @('```') + (Get-Content results\environment.txt, results\sizes.txt) + (Get-Content results\all.txt | ForEach-Object -Begin { $m = $false } -Process { if ($_ -match '^## ') { $m = $false }; if ($_ -match '^--- medians') { $m = $true }; if ($m -or $_ -notmatch '^\{') { $_ } }) + @('```')
          $summary | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-win32-x64
          path: results
          retention-days: 30
