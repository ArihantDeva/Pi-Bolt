name: bench

# The Pi-Bolt 1.0.0 performance candidate against 0.9.9 as released and PiG 0.5.1 (the Go port of Pi,
# github.com/MichaelKinsy/PiG), on GitHub's Linux x86-64 and ARM64 runners (pinned to one CPU) and macOS:
#   rel   pi-bolt-<platform>.tar.xz of the bolt-v0.9.9 release (SHA256SUMS signed by keys/release.pub)
#   cand  perf/v1.0.0 (this tree without the bench files), built by scripts/build-pi.sh on the runtimes of RUNTIME_RUN
#   pig   PiG 0.5.1 as released (SHA256SUMS and its sigstore bundle)
# long_transcript.py: frame cost on resumed sessions of 0, 2,292 and 4,000 entries, fullscreen and regular.
# bench/pig_verify.py first checks that every build does the same work. Results are the job summaries and an artifact per
# runner; the Windows runner is bench-windows.yml.
on:
  workflow_dispatch:
  push:
    branches: ["bench/v1.0.0*"]

permissions:
  contents: read
  actions: read

env:
  CAND_COMMIT: "d35149cb0"

jobs:
  bench:
    name: Bench on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            plat: linux-x64
            pig: linux-amd64
            cpus: "--cpus 1"
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            plat: linux-arm64
            pig: linux-arm64
            cpus: "--cpus 1"
          - name: macOS Apple silicon
            runner: macos-15
            plat: darwin-arm64
            pig: darwin-arm64
            cpus: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: "39894603087"
          PLAT: ${{ matrix.plat }}
          PIG_PLAT: ${{ matrix.pig }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux xz-utils >/dev/null
            OPENSSL=openssl
          else
            brew install bash tmux openssl@3 >/dev/null; echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"; export PATH="$(brew --prefix)/bin:$PATH"
            OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          fi
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          mkdir -p results .work
          # rel: Pi-Bolt 0.9.9 as released, checked against the release's signed checksums.
          gh release download bolt-v0.9.9 --repo "$GITHUB_REPOSITORY" --pattern "pi-bolt-$PLAT.tar.xz" --pattern "pi-bolt-$PLAT.tar.gz" \
            --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir .work/rel-dl
          "$OPENSSL" pkeyutl -verify -pubin -inkey keys/release.pub -rawin -in .work/rel-dl/SHA256SUMS -sigfile .work/rel-dl/SHA256SUMS.sig
          [ "$(head -n 1 .work/rel-dl/SHA256SUMS)" = "# pi-bolt 0.9.9" ]
          (cd .work/rel-dl && grep -E " pi-bolt-$PLAT\.tar\.(xz|gz)\$" SHA256SUMS | sha -c -)
          mkdir -p out/rel && tar -C out/rel --strip-components=1 -xJf ".work/rel-dl/pi-bolt-$PLAT.tar.xz"
          echo "rel: pi-bolt-$PLAT.tar.xz of bolt-v0.9.9 (SHA256SUMS signature and sum verified)" >>results/environment.txt
          # The candidate's runtime.
          gh run download "$RUNTIME_RUN" --repo "$GITHUB_REPOSITORY" --name "runtime-$PLAT" --dir .work/rt
          tar -C .work/rt -xzf ".work/rt/pi-bolt-runtime-$PLAT.tar.gz"
          mkdir -p .work/runtime && install -m 755 ".work/rt/pi-bolt-runtime-$PLAT/bun" .work/runtime/bun
          echo "runtime: run $RUNTIME_RUN, $(.work/runtime/bun --version), sha256 $(sha .work/runtime/bun | cut -d' ' -f1)" >>results/environment.txt
          # Packaged as scripts/package-release.sh packages it, for the archive's size.
          package() { # package NAME
            local stage=".work/$1-dl/stage/pi-bolt-$PLAT"
            mkdir -p "$stage" && cp -R "out/$1/." "$stage/"
            cp LICENSE THIRD_PARTY_NOTICES.md "$stage/" && cp LICENSE "$stage/LICENSE.pi"
            local TAR=(tar --owner=0 --group=0 --numeric-owner)
            [ "$RUNNER_OS" = macOS ] && TAR=(env COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --numeric-owner --no-xattrs --no-mac-metadata)
            local filters=(--lzma2=preset=9e); [ "$PLAT" = linux-x64 ] && filters=(--x86 "${filters[@]}")
            "${TAR[@]}" -C ".work/$1-dl/stage" -czf ".work/$1-dl/pi-bolt-$PLAT.tar.gz" "pi-bolt-$PLAT"
            "${TAR[@]}" -C ".work/$1-dl/stage" -cf - "pi-bolt-$PLAT" | xz -T0 "${filters[@]}" >".work/$1-dl/pi-bolt-$PLAT.tar.xz"
          }
          # cand: this tree's Pi (perf/v1.0.0; the bench files change nothing Pi builds).
          scripts/prepare-pi.sh
          scripts/build-pi.sh --out out/cand
          package cand
          echo "cand: perf/v1.0.0 ($CAND_COMMIT) by scripts/build-pi.sh on that runtime" >>results/environment.txt
          # pig: PiG 0.5.1 as released, checked against its SHA256SUMS and its build provenance (sigstore bundle).
          pig="pig-0.5.1-$PIG_PLAT.tar.gz"
          gh release download v0.5.1 --repo MichaelKinsy/PiG --pattern "$pig" --pattern "$pig.sigstore.json" --pattern SHA256SUMS --dir .work/pig-dl
          (cd .work/pig-dl && grep " $pig\$" SHA256SUMS | sha -c -)
          gh attestation verify ".work/pig-dl/$pig" --bundle ".work/pig-dl/$pig.sigstore.json" --repo MichaelKinsy/PiG >/dev/null
          echo "pig: $pig: SHA256SUMS and sigstore bundle verified (gh attestation verify)" >>results/environment.txt
          mkdir -p out/pig && tar -C out/pig --strip-components=1 -xzf ".work/pig-dl/$pig"
          for b in rel cand; do echo "$b: $(out/$b/pi --version </dev/null)"; done | tee -a results/environment.txt
          echo "pig: $(out/pig/pig --version </dev/null)" | tee -a results/environment.txt
          {
            echo "runner: ${{ matrix.runner }} ($(uname -srm)), $(nproc 2>/dev/null || sysctl -n hw.ncpu) CPUs"
            if [ "$RUNNER_OS" = Linux ]; then grep -m1 'model name' /proc/cpuinfo || lscpu | grep -m1 'Model name'; echo "THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"; else sysctl -n machdep.cpu.brand_string; sw_vers | tr '\n' ' '; echo; fi
            echo "python: $(python3 --version), tmux: $(tmux -V)"
          } >>results/environment.txt
      - name: Sizes
        env:
          PLAT: ${{ matrix.plat }}
        run: |
          set -euo pipefail
          bytes() { python3 -c "import os,sys; p=sys.argv[1]; print(os.path.getsize(p) if os.path.isfile(p) else sum(os.path.getsize(os.path.join(r,f)) for r,_,fs in os.walk(p) for f in fs if not os.path.islink(os.path.join(r,f))))" "$1"; }
          row() { printf '%-8s %-12s %14s  %s\n' "$1" "$2" "$(bytes "$3")" "$3"; }
          {
            printf '%-8s %-12s %14s  %s\n' build what bytes path
            for b in rel cand; do
              row $b archive.xz ".work/$b-dl/pi-bolt-$PLAT.tar.xz"
              row $b archive.gz ".work/$b-dl/pi-bolt-$PLAT.tar.gz"
              row $b binary out/$b/pi
              [ -f out/$b/pi-bin ] && row $b binary out/$b/pi-bin
              row $b installed out/$b
            done
            row pig archive.gz .work/pig-dl/pig-0.5.1-*.tar.gz
            row pig binary out/pig/pig
            row pig installed out/pig
          } | tee results/sizes.txt
      - name: Same work
        run: |
          python3 bench/pig_verify.py --build cand=out/cand/pi --build pig=out/pig/pig --build rel=out/rel/pi | tee results/verify.txt
      - name: Suites
        env:
          CPUS: ${{ matrix.cpus }}
        run: |
          B=(--build rel=out/rel/pi --build cand=out/cand/pi --build pig=out/pig/pig)
          run() { name=$1; out=$2; shift 2; echo "## $name" | tee -a results/all.txt; "$@" 2>&1 | grep -vE 'round [0-9]+/' | tee -a results/all.txt "results/$out" || echo "$name failed" | tee -a results/all.txt; }
          run benchmark benchmark.txt python3 bench/benchmark.py --runs 21 --warmup 3 $CPUS "${B[@]}" --baseline rel --out results/benchmark.jsonl
          for i in 1 2 3; do run "long_answer $i" "long_answer-$i.txt" python3 bench/long_answer.py --sizes 20000,60000 $CPUS "${B[@]}"; done
          run tmux_load tmux_load.txt python3 bench/tmux_load.py --steps md:20000,write:50 $CPUS "${B[@]}"
          run pauses pauses.txt python3 bench/pauses.py $CPUS "${B[@]}" --out results/pauses.jsonl
          run idle idle.txt python3 bench/idle.py --seconds 20 --rounds 2 "${B[@]}"
          run "idle 120 s" idle-120.txt python3 bench/idle.py --seconds 120 --rounds 1 "${B[@]}"
          run long_transcript long_transcript.txt python3 bench/long_transcript.py --entries 0,2292,4000 --mode fullscreen,regular --rounds 2 $CPUS "${B[@]}" --json results/long_transcript.jsonl
          run "long_transcript keys" long_transcript-keys.txt python3 bench/long_transcript.py --entries 2292 --mode fullscreen,regular --keys $CPUS "${B[@]}" --json results/long_transcript.jsonl
          for i in 1 2; do run "long_session $i" "long_session-$i.txt" python3 bench/long_session.py --prompts 40 --every 20 $CPUS "${B[@]}" --out results/long.jsonl; done
          { echo '```'; cat results/environment.txt results/sizes.txt results/verify.txt results/all.txt | awk '/^## /{m=0} /^--- medians/{m=1} m || !/^\{/'; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-${{ matrix.plat }}
          path: results/
          retention-days: 30
