<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="docs.css">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="site">
  <div class="bar">
    <button class="menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open the documentation menu">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    </button>
    <a class="brand" href="../"><img src="../logo.svg" alt="">Pi-Bolt</a>
    <a class="section-name" href="./">Docs</a>
    <button class="search-open" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Search docs</span><kbd>/</kbd>
    </button>
    <nav class="top" aria-label="Main">
      <a href="../#benchmarks">Benchmarks</a>
      <a href="https://github.com/opensec-git/Pi-Bolt/releases/latest">Releases</a>
      <a class="gh" href="https://github.com/opensec-git/Pi-Bolt">GitHub</a>
    </nav>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Documentation">
    {{SIDEBAR}}
  </aside>
  <div class="scrim" hidden></div>

  <main id="content">
    <article class="doc">
      {{BODY}}
    </article>
    <div class="doc-foot">
      <a class="edit" href="{{EDIT}}">Edit this page on GitHub</a>
    </div>
    {{PAGER}}
  </main>

  <aside class="toc-col">
    {{TOC}}
  </aside>
</div>

<footer>
  <div class="foot">
    <p><strong>Pi-Bolt</strong> is an independent fork of <a href="https://github.com/earendil-works/pi">Pi</a>, not affiliated with
      Pi's authors or with Oven. MIT licensed.</p>
    <p><a href="../">Home</a> · <a href="https://github.com/opensec-git/Pi-Bolt">GitHub</a> ·
      <a href="https://www.npmjs.com/package/pi-bolt">npm</a> · <a href="https://pi.dev/docs/latest">Pi documentation</a></p>
  </div>
</footer>

<div class="search" role="dialog" aria-modal="true" aria-label="Search the documentation" hidden>
  <div class="search-box">
    <div class="search-field">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6"/></svg>
      <input type="search" placeholder="Search the documentation" aria-label="Search the documentation" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <ul class="results" role="listbox" aria-label="Results"></ul>
  </div>
</div>
<script src="docs.js"></script>
</body>
</html>
