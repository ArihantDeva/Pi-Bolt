<text x="24" y="32" font-size="21" font-weight="650" fill="#f0f6fc">Long answers and large files</text>
<text x="24" y="54" font-size="13.5" fill="#9198a1">Answers streamed at 1,200 characters a second; a file written through a tool call. Lower is better.</text>
